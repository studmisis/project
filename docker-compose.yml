version: "3.9"

services:
  server:
    build: ./server
    container_name: node-server
    restart: always
    env_file: .env
    ports:
      - "${PORT}:3000"
    depends_on:
      - db

  frontend:
    build: ./web
    container_name: frontend
    restart: always
    ports:
      - "80:80"

  db:
    image: postgres:16
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
